<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Fono — Stories</title>
  <meta name="description" content="Stories and main idea: activity for speech therapy sessions.">
  <meta name="theme-color" content="#f4efe6">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="assets/icons/icon-192.png" type="image/png">
  <link rel="apple-touch-icon" href="assets/icons/apple-touch-icon.png">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="Fono">
  <link rel="preload" href="assets/fonts/atkinson-hyperlegible-latin-400-normal.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="stylesheet" href="css/styles.css">
</head>
<body>
  <header class="topbar">
    <button type="button" class="back" id="back" hidden>
      <span aria-hidden="true">‹</span> <span class="back-label" data-ui="back"></span>
    </button>
    <div class="controls">
      <div class="langs" id="langs" role="group" aria-label="Language"></div>
      <label class="switch">
        <input type="checkbox" id="anim-toggle" checked>
        <span class="switch-track" aria-hidden="true"><span class="switch-thumb"></span></span>
        <span class="switch-label" data-ui="animations"></span>
      </label>
    </div>
  </header>

  <main id="main">
    <section id="deck-view" class="view deck-view">
      <div class="deck-area">
        <button type="button" class="deck-nav" id="prev"><span aria-hidden="true">‹</span></button>
        <div class="deck" id="deck"></div>
        <button type="button" class="deck-nav" id="next"><span aria-hidden="true">›</span></button>
      </div>
      <p class="deck-hint" data-ui="deckHint"></p>
    </section>

    <section id="story-view" class="view story-view" hidden>
      <div class="story-layout">
        <figure class="card card-back story-figure">
          <div class="card-inner"><img id="story-image" alt=""></div>
        </figure>
        <article class="card card-front">
          <div class="card-inner">
            <p class="story-text" id="story-text"></p>
            <h2 class="question-pill" data-ui="question"></h2>
            <div class="options" id="options"></div>
            <span class="card-number" id="story-number"></span>
          </div>
        </article>
      </div>
      <p class="feedback" id="feedback" aria-live="polite"></p>
    </section>

    <p class="load-error" id="load-error" hidden>Could not load stories.</p>
  </main>

  <div class="confetti" id="confetti" aria-hidden="true"></div>

  <script src="js/app.js"></script>
</body>
</html>
